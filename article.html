<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Artículo | DropRugby</title>

<meta
id="meta-description"
name="description"
content="Noticias de rugby de DropRugby"

>

  <link rel="stylesheet" href="styles.css">

  <style>
    .dynamic-article {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .article-kicker {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .dynamic-article h1 {
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.05;
      margin: 0 0 18px;
    }

    .dynamic-article .lead {
      font-size: 20px;
      line-height: 1.55;
      opacity: .8;
      margin: 0 0 20px;
    }

    .dynamic-meta {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      margin-bottom: 30px;
      opacity: .7;
    }

    .dynamic-image {
      width: 100%;
      margin: 0 0 35px;
      overflow: hidden;
      border-radius: 12px;
      background: #eee;
    }

    .dynamic-image img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 650px;
      object-fit: cover;
    }

    .dynamic-body {
      max-width: 780px;
      margin: 0 auto;
      font-size: 19px;
      line-height: 1.8;
    }

    .dynamic-body p {
      margin: 0 0 24px;
    }

    .dynamic-share {
      max-width: 780px;
      margin: 50px auto 0;
      padding-top: 30px;
      border-top: 1px solid rgba(0,0,0,.12);
    }

    .dynamic-share h3 {
      margin-bottom: 15px;
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .share-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .share-x,
    .share-facebook,
    .share-instagram {
      background: #111;
      color: #fff;
    }

    .dynamic-related {
      margin-top: 60px;
    }

    .dynamic-related h2 {
      margin-bottom: 25px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .related-card {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .related-card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      background: #eee;
      margin-bottom: 12px;
    }

    .related-card-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .related-card-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      margin: 0 0 6px;
      opacity: .7;
    }

    .related-card h3 {
      font-size: 18px;
      line-height: 1.25;
      margin: 0 0 8px;
    }

    .related-card-date {
      font-size: 12px;
      opacity: .6;
    }

    .dynamic-back {
      display: inline-block;
      margin-top: 50px;
      font-weight: 800;
      text-decoration: none;
    }

    .article-error {
      max-width: 780px;
      margin: 80px auto;
      padding: 30px 20px;
    }

    @media (max-width: 800px) {
      .related-grid {
        grid-template-columns: 1fr;
      }

      .dynamic-article {
        padding-top: 25px;
      }

      .dynamic-body {
        font-size: 17px;
      }
    }
  </style>

</head>

<body>

  <main
    id="article-root"
    class="dynamic-article"
    aria-live="polite"
  >
    <p>Cargando artículo...</p>
  </main>

  <script>
  (async function () {

    "use strict";

    const root = document.getElementById("article-root");

    if (!root) {
      return;
    }

    function esc(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char];
        }
      );
    }

    function getArticleId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id") || "";
    }

    function canonicalUrl(articleId) {
      return new URL(
        "article.html?id=" +
        encodeURIComponent(articleId),
        window.location.href
      ).href;
    }

    function renderBody(value) {

      const text = String(value ?? "").trim();

      if (!text) {
        return "";
      }

      /*
       * El Admin guarda el contenido como texto.
       *
       * Dos saltos de línea = nuevo párrafo.
       * Un salto de línea = <br>.
       */

      return text
        .split(/\n\s*\n/)
        .map(function (paragraph) {

          return (
            "<p>" +
            esc(paragraph).replace(/\n/g, "<br>") +
            "</p>"
          );

        })
        .join("");
    }

    function articleImage(article, compact) {

      const image =
        article.imageUrl ||
        article.image ||
        "";

      if (image) {

        return `
          <div class="${
            compact
              ? "related-card-image"
              : "dynamic-image"
          }">

            <img
              src="${esc(image)}"
              alt="${esc(article.title || "Noticia")}"
              loading="${compact ? "lazy" : "eager"}"
            >

          </div>
        `;
      }

      return compact
        ? `<div class="related-card-image"></div>`
        : `<div class="dynamic-image"></div>`;
    }

    function getRelated(all, current) {

      const others = all.filter(function (article) {

        return (
          String(article.id) !== String(current.id) &&
          article.published !== false &&
          !article.scheduled
        );

      });

      const sameCategory = others
        .filter(function (article) {

          return String(article.category || "") ===
                 String(current.category || "");

        })
        .sort(function (a, b) {

          return String(b.date || "")
            .localeCompare(String(a.date || ""));

        });

      const sameSubcategory = others
        .filter(function (article) {

          return (
            String(article.subcategory || "") ===
              String(current.subcategory || "") &&
            String(article.category || "") !==
              String(current.category || "")
          );

        })
        .sort(function (a, b) {

          return String(b.date || "")
            .localeCompare(String(a.date || ""));

        });

      const rest = others
        .filter(function (article) {

          return (
            !sameCategory.includes(article) &&
            !sameSubcategory.includes(article)
          );

        })
        .sort(function (a, b) {

          return String(b.date || "")
            .localeCompare(String(a.date || ""));

        });

      return [
        ...sameCategory,
        ...sameSubcategory,
        ...rest
      ].slice(0, 3);
    }

    function renderRelated(items) {

      if (!items.length) {
        return "";
      }

      return `
        <section class="dynamic-related">

          <h2>Artículos relacionados</h2>

          <div class="related-grid">

            ${items.map(function (article) {

              return `
                <a
                  class="related-card"
                  href="article.html?id=${encodeURIComponent(article.id || "")}"
                >

                  ${articleImage(article, true)}

                  <p class="related-card-kicker">
                    ${esc(
                      String(
                        article.category || "RUGBY"
                      ).toUpperCase()
                    )}
                  </p>

                  <h3>
                    ${esc(
                      article.title || "Sin título"
                    )}
                  </h3>

                  <div class="related-card-date">
                    ${esc(article.date || "")}
                  </div>

                </a>
              `;

            }).join("")}

          </div>

        </section>
      `;
    }

    function renderError(message) {

      root.innerHTML = `
        <div class="article-error">

          <p class="article-kicker">
            DROP RUGBY
          </p>

          <h1>
            Artículo no encontrado.
          </h1>

          <p class="lead">
            ${esc(message)}
          </p>

          <a
            class="dynamic-back"
            href="index.html"
          >
            ← VOLVER A DROP RUGBY
          </a>

        </div>
      `;
    }

    try {

      const articleId = getArticleId();

      if (!articleId) {

        renderError(
          "No se indicó qué artículo se debe mostrar."
        );

        return;
      }

      /*
       * Cargamos el contenido público.
       */

      const response = await fetch(
        "/api/content?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {

        throw new Error(
          "No se pudo cargar el contenido."
        );

      }

      const data = await response.json();

      const articles =
        Array.isArray(data.articles)
          ? data.articles
          : [];

      /*
       * Buscamos la noticia por ID.
       */

      const article = articles.find(function (item) {

        return String(item.id) ===
               String(articleId);

      });

      if (!article) {

        renderError(
          "La publicación puede haber sido eliminada o todavía no está disponible."
        );

        return;
      }

      /*
       * No mostramos borradores ni noticias programadas.
       */

      if (
        article.published === false ||
        article.scheduled === true
      ) {

        renderError(
          "Esta publicación todavía no está disponible."
        );

        return;
      }

      const title =
        String(
          article.title || "Artículo"
        );

      const excerpt =
        String(
          article.excerpt || ""
        );

      const author =
        String(
          article.author || "DropRugby"
        );

      const category =
        String(
          article.category || "Rugby"
        );

      const subcategory =
        String(
          article.subcategory || "Actualidad"
        );

      const date =
        String(
          article.date || ""
        );

      const url =
        canonicalUrl(article.id);

      /*
       * SEO
       */

      document.title =
        title + " | DropRugby";

      const description =
        document.getElementById(
          "meta-description"
        );

      if (description) {

        description.setAttribute(
          "content",
          excerpt || title
        );

      }

      /*
       * Compartir
       */

      const shareText =
        encodeURIComponent(title);

      const shareUrl =
        encodeURIComponent(url);

      /*
       * Relacionadas
       */

      const related =
        getRelated(
          articles,
          article
        );

      /*
       * Contenido.
       *
       * IMPORTANTE:
       * article.content sigue siendo texto.
       * renderBody() lo transforma en HTML.
       */

      const body =
        renderBody(
          article.content
        );

      root.innerHTML = `

        <p class="article-kicker">
          ${esc(category.toUpperCase())}
          ·
          ${esc(subcategory.toUpperCase())}
        </p>

        <h1>
          ${esc(title)}
        </h1>

        ${
          excerpt
            ? `
              <p class="lead">
                ${esc(excerpt)}
              </p>
            `
            : ""
        }

        <div class="dynamic-meta">

          POR ${esc(author.toUpperCase())}

          ${date ? ` · ${esc(date)}` : ""}

        </div>

        ${articleImage(article, false)}

        <div class="dynamic-body">

          ${
            body ||
            (
              excerpt
                ? `<p>${esc(excerpt)}</p>`
                : "<p>Esta noticia todavía no tiene contenido.</p>"
            )
          }

        </div>

        <section
          class="dynamic-share"
          aria-label="Compartir este artículo"
        >

          <h3>
            Compartir este artículo
          </h3>

          <div class="share-buttons">

            <a
              class="share-button share-x"
              href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}"
              target="_blank"
              rel="noopener"
            >
              Compartir en X
            </a>

            <a
              class="share-button share-facebook"
              href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}"
              target="_blank"
              rel="noopener"
            >
              Compartir en Facebook
            </a>

            <button
              class="share-button share-instagram"
              type="button"
              id="share-instagram"
            >
              Compartir en Instagram
            </button>

          </div>

        </section>

        ${renderRelated(related)}

        <a
          class="dynamic-back"
          href="index.html"
        >
          ← VOLVER A DROP RUGBY
        </a>

      `;

      /*
       * Instagram / compartir.
       */

      document
        .getElementById("share-instagram")
        ?.addEventListener(
          "click",
          async function () {

            try {

              if (
                navigator.share
              ) {

                await navigator.share({
                  title: title,
                  url: url
                });

                return;
              }

              if (
                navigator.clipboard
              ) {

                await navigator.clipboard.writeText(
                  url
                );

              }

              window.open(
                "https://www.instagram.com/",
                "_blank",
                "noopener"
              );

              alert(
                "Copiamos el enlace del artículo. Pegalo en Instagram para compartirlo."
              );

            } catch (error) {

              console.log(
                "Compartir cancelado",
                error
              );

            }

          }
        );

    } catch (error) {

      console.error(
        "Error cargando artículo:",
        error
      );

      renderError(
        "Ocurrió un error al cargar la noticia."
      );

    }

  })();
  </script>

</body>
</html>
