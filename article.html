<script>
  function esc(s){
    return String(s??'').replace(/[&<>"']/g,c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
  }

  function canonicalUrl(articleId){
    return new URL(
      `article.html?id=${encodeURIComponent(articleId)}`,
      location.href
    ).href;
  }

  function renderBody(value){
    const text = String(value ?? '').trim();

    if(!text) return '';

    /*
      Si el contenido ya contiene HTML editorial,
      lo renderizamos como HTML.

      Esto permite:
      <h2>
      <h3>
      <p>
      <strong>
      <em>
      <ul>
      <ol>
      <li>
      <blockquote>
      <a>
      <br>
    */
    if(
      /<\/?(h2|h3|h4|p|strong|b|em|i|u|ul|ol|li|blockquote|a|br)\b/i
      .test(text)
    ){
      const template = document.createElement('template');

      template.innerHTML = text;

      const allowed = new Set([
        'H2',
        'H3',
        'H4',
        'P',
        'STRONG',
        'B',
        'EM',
        'I',
        'U',
        'UL',
        'OL',
        'LI',
        'BLOCKQUOTE',
        'A',
        'BR'
      ]);

      template.content.querySelectorAll('*').forEach(el => {

        /*
          Si aparece una etiqueta que no permitimos,
          quitamos solamente la etiqueta y conservamos
          su contenido.
        */
        if(!allowed.has(el.tagName)){
          el.replaceWith(...el.childNodes);
          return;
        }

        /*
          Limpiamos atributos para evitar que una noticia
          pueda inyectar código o estilos.

          En enlaces solamente permitimos href.
        */
        [...el.attributes].forEach(attr => {

          if(
            el.tagName === 'A' &&
            attr.name.toLowerCase() === 'href'
          ){
            const href = attr.value.trim();

            if(
              href.startsWith('https://') ||
              href.startsWith('http://') ||
              href.startsWith('/')
            ){
              el.setAttribute('href', href);
              el.setAttribute('target', '_blank');
              el.setAttribute(
                'rel',
                'noopener noreferrer'
              );
            }else{
              el.removeAttribute('href');
            }

          }else{
            el.removeAttribute(attr.name);
          }

        });
      });

      return template.innerHTML;
    }

    /*
      Si la noticia está escrita como texto plano,
      seguimos utilizando el comportamiento anterior:

      Cada párrafo separado por una línea en blanco
      se convierte automáticamente en <p>.
    */
    return text
      .split(/\n\s*\n/)
      .map(
        p =>
          `<p>${esc(p).replace(/\n/g,'<br>')}</p>`
      )
      .join('');
  }

  function articleImage(a, compact=false){

    if(a.imageUrl){

      return `
        <div class="${
          compact
            ? 'related-card-image'
            : 'dynamic-image'
        }">

          <img
            src="${esc(a.imageUrl)}"
            alt="${esc(a.title)}"
            loading="${compact ? 'lazy' : 'eager'}"
          >

        </div>
      `;
    }

    return compact

      ? `
        <div class="related-card-image ${
          esc(a.imageClass || 'img-tone-1')
        }"></div>
      `

      : `
        <div class="dynamic-image ${
          esc(a.imageClass || 'img-tone-1')
        }"></div>
      `;
  }

  function getRelated(all, current){

    const others = all.filter(a =>
      String(a.id) !== String(current.id) &&
      a.published !== false &&
      !a.scheduled
    );

    const sameCategory = others
      .filter(
        a =>
          String(a.category || '') ===
          String(current.category || '')
      )
      .sort(
        (a,b) =>
          String(b.date || '').localeCompare(
            String(a.date || '')
          )
      );

    const sameSubcategory = others
      .filter(
        a =>
          String(a.subcategory || '') ===
          String(current.subcategory || '') &&
          String(a.category || '') !==
          String(current.category || '')
      )
      .sort(
        (a,b) =>
          String(b.date || '').localeCompare(
            String(a.date || '')
          )
      );

    const rest = others
      .filter(
        a =>
          !sameCategory.includes(a) &&
          !sameSubcategory.includes(a)
      )
      .sort(
        (a,b) =>
          String(b.date || '').localeCompare(
            String(a.date || '')
          )
      );

    return [
      ...sameCategory,
      ...sameSubcategory,
      ...rest
    ].slice(0,3);
  }

  function renderRelated(items){

    if(!items.length) return '';

    return `
      <section class="dynamic-related">

        <h2>Artículos relacionados</h2>

        <div class="related-grid">

          ${items.map(a => `

            <a
              class="related-card"
              href="article.html?id=${encodeURIComponent(a.id || '')}"
            >

              ${articleImage(a,true)}

              <p class="related-card-kicker">
                ${esc(
                  String(
                    a.category || 'RUGBY'
                  ).toUpperCase()
                )}
              </p>

              <h3>
                ${esc(a.title || 'Sin título')}
              </h3>

              <div class="related-card-date">
                ${esc(a.date || '')}
              </div>

            </a>

          `).join('')}

        </div>

      </section>
    `;
  }

  try{

    let data;

    const res = await fetch(
      '/api/content?t=' + Date.now(),
      {
        cache:'no-store'
      }
    );

    if(!res.ok) throw new Error();

    data = await res.json();

    const a = (data.articles || []).find(
      x => String(x.id) === String(id)
    );

    if(!a) throw new Error();

    const url = canonicalUrl(a.id);

    const title = String(
      a.title || 'Artículo'
    );

    const excerpt = String(
      a.excerpt || ''
    );

    const all = Array.isArray(data.articles)
      ? data.articles
      : [];

    document.title =
      `${title} | DropRugby`;

    document
      .getElementById('meta-description')
      .content = excerpt;

    const shareText =
      encodeURIComponent(title);

    const shareUrl =
      encodeURIComponent(url);

    const related =
      getRelated(all,a);

    root.innerHTML = `

      <p class="article-kicker">

        ${esc(
          String(
            a.category || 'RUGBY'
          ).toUpperCase()
        )}

        ·

        ${esc(
          String(
            a.subcategory || 'ACTUALIDAD'
          ).toUpperCase()
        )}

      </p>

      <h1>
        ${esc(title)}
      </h1>

      <p class="lead">
        ${esc(excerpt)}
      </p>

      <div class="dynamic-meta">

        POR

        ${esc(
          String(
            a.author || 'DROPRUGBY'
          ).toUpperCase()
        )}

        ·

        ${esc(a.date || '')}

      </div>

      ${articleImage(a)}

      <div class="dynamic-body">

        ${
          renderBody(a.content) ||
          `<p>${esc(excerpt)}</p>`
        }

      </div>

      <section
        class="dynamic-share"
        aria-label="Compartir este artículo"
      >

        <h3>
          Compartir este artículo
        </h3>

        <div class="share-buttons">

          <a
            class="share-button share-x"
            href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}"
            target="_blank"
            rel="noopener"
          >
            Compartir en X
          </a>

          <a
            class="share-button share-facebook"
            href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}"
            target="_blank"
            rel="noopener"
          >
            Compartir en Facebook
          </a>

          <button
            class="share-button share-instagram"
            type="button"
            id="share-instagram"
          >
            Compartir en Instagram
          </button>

        </div>

      </section>

      ${renderRelated(related)}

      <a
        class="dynamic-back"
        href="index.html"
      >
        ← VOLVER A DROP RUGBY
      </a>

    `;

    document
      .getElementById('share-instagram')
      ?.addEventListener(
        'click',
        async () => {

          try{

            if(navigator.share){

              await navigator.share({
                title,
                url
              });

              return;
            }

            await navigator
              .clipboard
              ?.writeText(url);

            window.open(
              'https://www.instagram.com/',
              '_blank',
              'noopener'
            );

            alert(
              'Copiamos el enlace del artículo. Pegalo en Instagram para compartirlo.'
            );

          }catch(_){}

        }
      );

  }catch(e){

    root.innerHTML = `
      <p class="article-kicker">
        DROP RUGBY
      </p>

      <h1>
        Artículo no encontrado.
      </h1>

      <p class="lead">
        La publicación puede haber sido eliminada
        o todavía no está disponible.
      </p>

      <a
        class="dynamic-back"
        href="index.html"
      >
        ← VOLVER A DROP RUGBY
      </a>
    `;
  }

})();
