<head>
  <meta charset="UTF-8">

  <meta name="description" content="Calendario de partidos del URBA Top 14 y del rugby internacional: horarios y dónde ver cada encuentro.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DropRugby">
  <meta property="og:title" content="Calendario de partidos | DropRugby">
  <meta property="og:description" content="Calendario de partidos del URBA Top 14 y del rugby internacional: horarios y dónde ver cada encuentro.">
  <meta property="og:url" content="https://www.droprugby.com/calendario.html">
  <meta property="og:image" content="https://www.droprugby.com/logo.png">
  <meta name="google-adsense-account" content="ca-pub-7081370352193016">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/brand.css?v=20261110">
  <link rel="stylesheet" href="assets/css/styles.css?v=20261110">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7081370352193016" crossorigin="anonymous"></script>
</head>
<body data-page="calendario">
  <!-- El header y el footer los arma assets/js/script.js (renderLayout) para que sean iguales en todas las páginas. -->
  <div id="site-header" style="min-height:68px;background:#0d0f11"></div>

  <main>
    <section class="page-head" data-word="AGENDA">
      <div class="wrap">
        <div class="breadcrumbs"><a href="index.html">Inicio</a><span>/</span><span>Calendario</span></div>
        <span class="drop-kicker">Agenda deportiva</span>
        <h1>Calendario</h1>
        <p class="intro">Los partidos del URBA Top 14 y del rugby internacional, con horario y dónde verlos.</p>
      </div>
    </section>

    <section class="page-body">
      <div class="wrap">
        <div class="calendar-controls">
          <div class="competition-select">
            <button class="filter-chip active" data-filter="TODAS">Todas</button>
            <button class="filter-chip" data-filter="LOS PUMAS">Los Pumas</button>
            <button class="filter-chip" data-filter="SUPER RUGBY">Internacional</button>
            <button class="filter-chip" data-filter="URBA TOP 14">URBA Top 14</button>
          </div>
          <div class="day-nav">
            <button class="day-nav-btn" id="day-prev" aria-label="Día anterior">←</button>
            <button class="day-nav-today" id="day-today">HOY</button>
            <button class="day-nav-btn" id="day-next" aria-label="Día siguiente">→</button>
          </div>
        </div>

        <div class="date-filter-bar">
          <button class="date-chip active" data-mode="dia">Día</button>
          <button class="date-chip" data-mode="manana">Mañana</button>
          <button class="date-chip" data-mode="finde">Fin de semana</button>
          <button class="date-chip" data-mode="semana">Toda la semana</button>
        </div>

        <p class="day-nav-label" id="day-nav-label"></p>
        <div class="calendar-list" id="calendar-list"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/script.js?v=20261110"></script>
</body>
</html>
