<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de partidos | DropRugby</title>
  <meta name="description" content="Calendario de partidos del URBA Top 14 y del rugby internacional: horarios y dónde ver cada encuentro.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0d0f11">
  <link rel="canonical" href="https://www.droprugby.com/calendario.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DropRugby">
  <meta property="og:title" content="Calendario de partidos | DropRugby">
  <meta property="og:description" content="Calendario de partidos del URBA Top 14 y del rugby internacional: horarios y dónde ver cada encuentro.">
  <meta property="og:url" content="https://www.droprugby.com/calendario.html">
  <meta property="og:image" content="https://www.droprugby.com/logo.png">
  <meta name="google-adsense-account" content="ca-pub-7081370352193016">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/brand.css?v=20261122">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20261122">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7081370352193016" crossorigin="anonymous"></script>
  <link rel="preload" as="image" href="/assets/img/drop-intro.jpg">
  <link rel="preload" as="image" href="/assets/img/drop-intro-leg.png">
  <script>try{if(sessionStorage.getItem("dropIntro"))document.documentElement.classList.add("intro-seen");else document.documentElement.classList.add("intro-on")}catch(e){document.documentElement.classList.add("intro-seen")}</script>
</head>
<body data-page="calendario">
  <!-- Pantalla de inicio: se muestra una vez por visita (assets/js/script.js la retira). -->
  <div id="drop-intro" aria-hidden="true">
    <div class="intro-stage">
      <img src="/assets/img/drop-intro.jpg" alt="" width="900" height="900" decoding="async" onload="var d=this.closest('#drop-intro'),go=function(){d.classList.add('go')};(this.decode?this.decode():Promise.resolve()).then(go,go)" onerror="this.closest('#drop-intro').remove()">
      <img class="intro-leg" src="/assets/img/drop-intro-leg.png" alt="" decoding="async">
      <i class="intro-dust"></i><i class="intro-dust d2"></i><i class="intro-dust d3"></i>
      <svg class="intro-ball" viewBox="0 0 60 84" aria-hidden="true"><ellipse cx="30" cy="42" rx="27" ry="39" fill="#0d0f11" stroke="#f0ebe5" stroke-width="3"/><path d="M16 22 C 20 12, 34 8, 42 14" fill="none" stroke="#f0ebe5" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg>
      <i class="intro-flash"></i>
    </div>
  </div>
  <!-- El header y el footer los arma assets/js/script.js (renderLayout) para que sean iguales en todas las páginas. -->
  <div id="site-header" style="min-height:68px;background:#0d0f11"></div>

  <main>
    <section class="page-head" data-word="AGENDA">
      <div class="wrap">
        <div class="breadcrumbs"><a href="index.html">Inicio</a><span>/</span><span>Calendario</span></div>
        <span class="drop-kicker">Agenda deportiva</span>
        <h1>Calendario</h1>
        <p class="intro">Los partidos del URBA Top 14, la Primera A y el rugby internacional, con horario y dónde verlos.</p>
      </div>
    </section>

    <section class="page-body">
      <div class="wrap">
        <div class="calendar-controls">
          <div class="competition-select">
            <button class="filter-chip active" data-filter="TODAS">Todas</button>
            <button class="filter-chip" data-filter="LOS PUMAS">Los Pumas</button>
            <button class="filter-chip" data-filter="SUPER RUGBY">Internacional</button>
            <button class="filter-chip" data-filter="URBA TOP 14">URBA Top 14</button>
            <button class="filter-chip" data-filter="URBA PRIMERA A">Primera A</button>
          </div>
          <div class="day-nav">
            <button class="day-nav-btn" id="day-prev" aria-label="Día anterior">←</button>
            <button class="day-nav-today" id="day-today">HOY</button>
            <button class="day-nav-btn" id="day-next" aria-label="Día siguiente">→</button>
          </div>
        </div>

        <div class="date-filter-bar">
          <button class="date-chip active" data-mode="dia">Día</button>
          <button class="date-chip" data-mode="manana">Mañana</button>
          <button class="date-chip" data-mode="finde">Fin de semana</button>
          <button class="date-chip" data-mode="semana">Toda la semana</button>
        </div>

        <p class="day-nav-label" id="day-nav-label"></p>
        <div class="calendar-list" id="calendar-list"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/script.js?v=20261122"></script>
  <script src="/assets/js/games.js?v=20261122"></script>
</body>
</html>
